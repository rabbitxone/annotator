<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dark page</title>
    <style>
      body { margin: 0; padding: 40px 20px; background: #0f172a; color: #e2e8f0; font: 18px/1.6 Georgia, serif; }
      main { max-width: 640px; margin: 0 auto; }
      .card { background: #f8fafc; color: #0f172a; padding: 12px 16px; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <p id="dark-text">Light text on a dark page should get a glowing highlight instead of a muddy one.</p>
      <p class="card"><span id="card-text">But a light card on that same page needs the light colours again.</span></p>
    </main>
  </body>
</html>
