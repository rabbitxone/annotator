<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotator</title>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="stylesheet" href="fonts/fonts.css" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <link rel="stylesheet" href="styles/snapshot.css" />
  </head>
  <body>
    <header class="snap-bar">
      <a class="icon-btn snap-back" id="back" href="dashboard.html" data-i18n-title="actionBack" data-i18n-aria-label="actionBack">
        <span data-icon="back" data-size="18"></span>
      </a>
      <div class="snap-heading">
        <p class="snap-kicker">
          <span class="badge badge-accent"><span data-icon="archive" data-size="12"></span><span data-i18n="snapshotBadge"></span></span>
          <span id="snap-date"></span>
        </p>
        <h1 class="display snap-title" id="snap-title"></h1>
        <a class="snap-source" id="snap-source" target="_blank" rel="noopener noreferrer"></a>
      </div>
      <div class="snap-controls">
        <label class="snap-version" id="snap-version-wrap" hidden>
          <span class="sr-only" data-i18n="snapshotVersion"></span>
          <select id="snap-version" class="input"></select>
        </label>
        <button class="btn btn-outline btn-sm" type="button" id="snap-images" hidden>
          <span data-icon="image" data-size="14"></span>
          <span id="snap-images-label"></span>
        </button>
        <button class="btn btn-outline btn-sm" type="button" id="snap-download">
          <span data-icon="download" data-size="14"></span>
          <span data-i18n="snapshotDownload"></span>
        </button>
        <button class="icon-btn danger" type="button" id="snap-delete" data-i18n-title="snapshotDelete" data-i18n-aria-label="snapshotDelete">
          <span data-icon="delete" data-size="16"></span>
        </button>
      </div>
    </header>

    <div class="snap-layout" id="snap-layout">
      <article class="snap-article" id="snap-article"></article>
      <aside class="snap-notes" id="snap-notes"></aside>
    </div>

    <script src="snapshot.js"></script>
  </body>
</html>
